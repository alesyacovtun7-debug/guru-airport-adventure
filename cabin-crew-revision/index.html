<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cabin Crew Revision</title>
    <meta name="description" content="An English revision game for future cabin crew.">
    <style>
:root{
  font: 16px/1.5 "Segoe UI",Arial,sans-serif;
  color:#182032;background:#f5f4ef;font-synthesis:none;
  --ink:#182032;--blue:#2034a6;--muted:#535e72;--line:#dbdfe8;
}
*{box-sizing:border-box}
body{margin:0;min-width:0}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,summary:focus-visible{outline:3px solid #2346db;outline-offset:4px}
h1[tabindex]:focus{outline:none}
img{display:block;max-width:100%}
h1,h2,p{margin:0}
.shell{width:min(1120px,calc(100% - 72px));margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:78px}
.brand{border:0;padding:0;background:none;display:flex;align-items:center;gap:10px;color:var(--ink);font-size:17px;text-align:left}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:white;font-weight:850;font-size:15px;letter-spacing:.03em}
.top-label{color:var(--muted);font-size:14px}
.hero{position:relative;display:grid;grid-template-columns:49% 51%;min-height:420px;overflow:hidden;border-radius:26px;background:#2337a9;color:#fff;isolation:isolate}
.hero-content{position:relative;z-index:1;padding:39px 0 37px 49px;align-self:center}
.hero-label{display:flex;align-items:center;gap:9px;color:#e0e8ff;font-size:14px;font-weight:650}
.hero-label span{width:8px;height:8px;border-radius:50%;background:#d9ef8e}
.hero h1{margin:12px 0 14px;font-size:clamp(46px,7vw,94px);line-height:.94;letter-spacing:-.071em;font-weight:820}
.hero p{max-width:345px;color:#f0f2ff;font-size:17px;margin-bottom:23px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:11px 19px;min-height:47px;border:1px solid transparent;border-radius:11px;font-weight:700}
.button.primary{background:#e2f2a7;color:#182437}
.button.primary:hover{background:#f0ffbd}
.hero button:focus-visible{outline-color:white}
.hero-meta{display:flex;gap:8px;color:#e0e8ff;font-size:13px;margin-top:11px}
.hero-visual{align-self:stretch;position:relative;display:grid;place-items:center;min-width:0}
.hero-visual img{width:98%;max-height:430px;object-fit:contain;position:relative;filter:drop-shadow(0 18px 17px #080f514c);transform:rotate(-6deg)}
.route{padding:27px 0 42px}
.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:8px 18px;flex-wrap:wrap;margin-bottom:14px}
.section-heading h2{font-size:28px;letter-spacing:-.045em}
.section-heading p{font-size:14px;color:var(--muted)}
.unit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.pink{--tint:#f2ced9;--ticket:#fff0f4}
.blue{--tint:#ceddfb;--ticket:#eef4ff}
.yellow{--tint:#f4e4a9;--ticket:#fff6d7}
.unit-card{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-width:0;min-height:219px;padding:16px 17px 15px;border:1px solid #20253920;border-radius:19px;color:var(--ink);background:var(--tint)}
.unit-card:hover{border-color:var(--blue)}
.unit-index{position:relative;z-index:1;display:inline-flex;align-items:center;align-self:flex-start;padding:4px 9px;background:var(--ticket);border-radius:6px;font-weight:750;font-size:12px}
.unit-card img{position:absolute;z-index:-1;right:-34px;bottom:-35px;width:62%;height:104%;object-fit:contain;object-position:right bottom;pointer-events:none}
.unit-card.yellow img{right:-19px;bottom:-14px;width:57%;height:91%}
.unit-body{display:flex;flex-direction:column;align-items:flex-start;max-width:62%}
.unit-stage{font-size:13px;font-weight:750}
.unit-body strong{font-size:clamp(19px,2.15vw,25px);line-height:1.02;letter-spacing:-.045em;margin:4px 0 6px}
.unit-subtitle{font-size:13px;line-height:1.22;color:#343e54}
.unit-link{font-size:14px;color:#192c94;margin-top:10px;font-weight:750}
.play-layout{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:18px;padding-bottom:30px}
.play-main,.results{background:#fff;border:1px solid #e0e2e7;border-radius:23px}
.play-main{padding:clamp(20px,4vw,44px)}
.play-art{isolation:isolate;position:relative;min-height:330px;padding:22px;overflow:hidden;background:var(--tint);border-radius:23px}
.play-art-title{position:relative;z-index:1;font-size:clamp(23px,3vw,39px);font-weight:800;letter-spacing:-.055em}
.play-art img{position:absolute;inset:auto 0 -5% 0;margin:auto;width:100%;height:83%;object-fit:contain;object-position:bottom}
.round-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;font-weight:650}
progress{display:block;appearance:none;width:100%;height:8px;border:0;border-radius:12px;overflow:hidden;background:#eaedf6;margin:8px 0 24px;color:#354bc4}
progress::-webkit-progress-bar{background:#eaedf6}
progress::-webkit-progress-value{background:#354bc4;border-radius:12px}
progress::-moz-progress-bar{background:#354bc4}
.question-topic{font-size:14px;font-weight:720;color:#3244a8;margin-bottom:7px}
.prompt{font-size:clamp(22px,3.05vw,38px);line-height:1.13;letter-spacing:-.038em;margin-bottom:20px;overflow-wrap:anywhere}
.answers{display:grid;gap:8px}
.answer{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:#fff;border:1px solid #cbd1df;border-radius:11px;color:var(--ink);padding:8px 11px;min-height:48px}
.answer-key{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:7px;background:#eff1f6;color:#38465e;font-size:13px;font-weight:750}
.answer:not(:disabled):hover,.answer[aria-pressed="true"]{background:#eef1ff;border-color:#455bca}
.answer.correct{background:#e7f6e9;border-color:#328147}
.answer.incorrect{background:#fcecee;border-color:#b15264}
.feedback:not(:empty){margin-top:13px;padding:10px 13px;border-radius:10px;color:#263242;background:#eef4f0;font-size:14px}
.feedback span,.feedback strong{display:block}
.feedback.try-again{background:#fff1e7}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}
.button.dark{color:white;background:#2438aa}
.button.dark:hover:not(:disabled){background:#192b89}
.button.dark:disabled{background:#e9edf5;color:#596577}
.button.outline{border-color:#a5add2;color:var(--blue);background:white}
.button.outline:hover{background:#edf0ff}
.speaking-task{font-size:clamp(17px,2vw,20px);line-height:1.45}
.hints{display:flex;flex-wrap:wrap;gap:7px;list-style:none;padding:0;margin:17px 0}
.hints li{background:#edf1ff;padding:6px 9px;border-radius:7px;font-weight:650;font-size:14px}
.model,.review{border:1px solid var(--line);padding:10px 13px;border-radius:10px}
summary{cursor:pointer;color:var(--blue);font-weight:700}
.model p{margin-top:9px}
.results{max-width:820px;margin:0 auto 36px;overflow:hidden}
.result-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;background:var(--blue);color:white;padding:20px clamp(20px,4vw,41px)}
.result-head h1{font-size:clamp(22px,4.5vw,48px);letter-spacing:-.06em}
.result-head p{color:#e0e8ff}
.result-head img{max-height:215px;object-fit:contain}
.score{font-size:clamp(34px,7vw,75px);line-height:1.2;font-weight:800;letter-spacing:-.065em;color:#e2f2a7}
.score span{font-size:.56em;color:white;letter-spacing:-.04em}
.result-body{padding:20px clamp(20px,4vw,41px) 24px}
.score-list{margin:0 0 13px;padding:0;list-style:none}
.score-list li{display:flex;justify-content:space-between;align-items:center;gap:13px;border-bottom:1px solid var(--line);padding:9px 0}
.score-list li:last-child{border-bottom:0}
.score-list li>strong{white-space:nowrap}
.review ol{padding-left:22px;margin-bottom:0}
.review li{padding:7px 0}
.review span,.review small{display:block}
@media(max-width:850px){
  .shell{width:calc(100% - 40px)}
  .hero{min-height:350px;grid-template-columns:53% 47%}
  .hero-content{padding-left:30px}
  .unit-card img{right:-37px;width:61%}
  .unit-body{max-width:64%}
}
@media(max-width:610px){
  .shell{width:calc(100% - 28px)}
  .top{min-height:60px}
  .top-label{display:none}
  .hero{grid-template-columns:1fr;min-height:0;border-radius:19px}
  .hero-content{padding:23px 19px 20px}
  .hero h1{font-size:clamp(43px,11.5vw,66px)}
  .hero p{font-size:15px;max-width:235px}
  .hero-visual{position:absolute;inset:auto -13% -5% auto;width:51%;opacity:.96;pointer-events:none}
  .hero-visual img{width:100%}
  .hero-content .primary{position:relative}
  .route{padding-top:19px}
  .section-heading{display:block}
  .section-heading h2{font-size:24px}
  .unit-grid{grid-template-columns:1fr;gap:10px}
  .unit-card{min-height:165px;border-radius:15px}
  .unit-card img{right:0;height:135%;width:44%;bottom:-40px}
  .unit-card.yellow img{right:0;width:44%;height:104%;bottom:-11px}
  .unit-body{max-width:65%}
  .play-layout{grid-template-columns:1fr;gap:10px}
  .play-main{border-radius:17px}
  .play-art{display:none}
  .result-head{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr)}
}
@media(max-width:380px){.hero-visual{display:none}.hero p{max-width:100%}}

</style>
  </head>

    <div id="root"></div>
    <script>

const root = document.querySelector("#root");

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]
  ));
}

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function render(content, focus = true) {
  root.innerHTML = `
    <header class="top shell">
      <button class="brand" data-action="home" aria-label="Cabin Crew English home">
        <span class="brand-mark" aria-hidden="true">CC</span>
        <span>Cabin Crew <strong>English</strong></span>
      </button>
      <span class="top-label">Course revision</span>
    </header>
    <main class="shell">${content}</main>`;
  if (focus) {
    window.scrollTo(0, 0);
    root.querySelector("h1")?.focus({ preventScroll: true });
  }
}

function home(focus = true) {
  run = null;
  render(`
    <section class="hero">
      <div class="hero-content">
        <div class="hero-label"><span></span> Units 01–03</div>
        <h1 tabindex="-1" lang="en">Cabin Crew<br>Revision</h1>
        <p>Practise your English for the interview, boarding and life on board.</p>
        <button class="button primary" data-action="mixed">Mixed flight <span aria-hidden="true">→</span></button>
        <div class="hero-meta">36 questions <span>·</span> 3 speaking tasks</div>
      </div>
      <div class="hero-visual"><img src="${artwork.aircraft}" alt=""></div>
    </section>
    <section class="route" aria-labelledby="route-heading">
      <div class="section-heading"><h2 id="route-heading">Choose a stage</h2><p>12 questions and a speaking task in each unit</p></div>
      <div class="unit-grid">
        ${units.map(unit => `
          <button class="unit-card ${unit.color}" data-action="unit" data-unit="${unit.id}">
            <span class="unit-index">Unit 0${unit.id}</span>
            <img src="${unit.image}" alt="">
            <span class="unit-body">
              <span class="unit-stage" lang="en">${unit.stage}</span>
              <strong lang="en">${unit.title}</strong>
              <span class="unit-subtitle">${unit.subtitle}</span>
              <span class="unit-link">Play <span aria-hidden="true">→</span></span>
            </span>
          </button>`).join("")}
      </div>
    </section>
  `, focus);
}

function start(mode, id, missed = []) {
  const questions = mode === "retry" ? shuffle(missed) : mode === "mixed"
    ? shuffle(bank) : shuffle(bank.filter(question => question.unit === id));
  const speaking = mode === "retry" ? [] : mode === "mixed" ? units : units.filter(unit => unit.id === id);
  run = {
    mode, id, questions, speaking, index: 0, speakingIndex: 0, correct: 0,
    wrong: [], selected: null, checked: false, example: false,
  };
  showQuestion();
}

function courseProgress(label, current, total) {
  return `<div class="round-meta">
    <span>${label}</span><span>${current} / ${total}</span>
  </div><progress value="${current}" max="${total}" aria-label="${label}"></progress>`;
}

function playFrame(unit, body) {
  return `<div class="play-layout">
    <div class="play-main">${body}</div>
    <aside class="play-art ${unit.color}">
      <span class="unit-index">Unit 0${unit.id}</span>
      <div class="play-art-title" lang="en">${unit.stage}</div>
      <img src="${unit.image}" alt="">
    </aside>
  </div>`;
}

function showQuestion() {
  const question = run.questions[run.index];
  const unit = units[question.unit - 1];
  run.options = shuffle(question.options);
  const label = run.mode === "retry" ? "Retry mistakes" : run.mode === "mixed" ? "Mixed flight" : `Unit 0${unit.id}`;
  render(playFrame(unit, `
    ${courseProgress(label, run.index + 1, run.questions.length)}
    <div class="question-topic" lang="en">${escapeHtml(question.topic)}</div>
    <h1 class="prompt" tabindex="-1" lang="en">${escapeHtml(question.prompt)}</h1>
    <div class="answers" role="group" aria-label="Answer choices">
      ${run.options.map((answer, index) => `<button class="answer" data-action="select" data-index="${index}" aria-pressed="false">
        <span class="answer-key" aria-hidden="true">${letters[index]}</span><span lang="en">${escapeHtml(answer)}</span>
      </button>`).join("")}
    </div>
    <div class="feedback" aria-live="polite" aria-atomic="true"></div>
    <div class="actions"><button class="button dark" data-action="check" disabled>Check answer</button></div>
  `));
}

function select(index) {
  if (run.checked) return;
  run.selected = index;
  for (const item of root.querySelectorAll(".answer")) {
    item.setAttribute("aria-pressed", String(Number(item.dataset.index) === index));
  }
  root.querySelector("[data-action=check]").disabled = false;
}

function check() {
  if (run.checked || run.selected === null) return;
  const question = run.questions[run.index];
  const correct = run.options[run.selected] === question.answer;
  run.checked = true;
  if (correct) run.correct++;
  else run.wrong.push(question);

  for (const item of root.querySelectorAll(".answer")) {
    const index = Number(item.dataset.index);
    item.disabled = true;
    if (run.options[index] === question.answer) item.classList.add("correct");
    else if (index === run.selected) item.classList.add("incorrect");
  }
  const feedback = root.querySelector(".feedback");
  feedback.classList.add(correct ? "success" : "try-again");
  feedback.innerHTML = `<strong>${correct ? "Correct!" : "Correct answer: " + escapeHtml(question.answer)}</strong>
    <span>${escapeHtml(question.note)}</span>`;
  const next = root.querySelector("[data-action=check]");
  next.dataset.action = "next";
  next.textContent = run.index + 1 < run.questions.length ? "Next question →" : run.speaking.length ? "Start speaking →" : "See results →";
  next.focus({ preventScroll: true });
}

function next() {
  run.index++;
  run.selected = null;
  run.checked = false;
  if (run.index < run.questions.length) showQuestion();
  else if (run.speaking.length) showSpeaking();
  else showResults();
}

function showSpeaking() {
  const unit = run.speaking[run.speakingIndex];
  render(playFrame(unit, `
    ${courseProgress("Speaking", run.speakingIndex + 1, run.speaking.length)}
    <div class="question-topic">Unit 0${unit.id} · Speaking task</div>
    <h1 class="prompt" tabindex="-1">Say it out loud</h1>
    <p class="speaking-task" lang="en">${escapeHtml(unit.task)}</p>
    <ul class="hints" lang="en">${unit.hints.map(hint => `<li>${escapeHtml(hint)}</li>`).join("")}</ul>
    <details class="model"><summary>Show a sample answer</summary><p lang="en">${escapeHtml(unit.example)}</p></details>
    <div class="actions"><button class="button dark" data-action="speak-next">${run.speakingIndex + 1 < run.speaking.length ? "Next task →" : "See results →"}</button></div>
  `));
}

function showResults() {
  const total = run.questions.length;
  const summaries = units.map(unit => ({
    unit, total: run.questions.filter(question => question.unit === unit.id).length,
    missed: run.wrong.filter(question => question.unit === unit.id).length,
  })).filter(record => record.total);

  render(`
    <section class="results">
      <div class="result-head">
        <div><h1 tabindex="-1">Flight complete!</h1><p>Correct answers</p><div class="score">${run.correct}<span> / ${total}</span></div></div>
        <img src="${artwork.aircraft}" alt="">
      </div>
      <div class="result-body">
        <ul class="score-list">${summaries.map(({unit, total, missed}) =>
          `<li><span>Unit 0${unit.id} · <b lang="en">${unit.title}</b></span><strong>${total - missed} / ${total}</strong></li>`).join("")}
        </ul>
        ${run.wrong.length ? `<details class="review"><summary>Review mistakes (${run.wrong.length})</summary>
          <ol>${run.wrong.map(question => `<li><b lang="en">${escapeHtml(question.prompt)}</b><span lang="en">${escapeHtml(question.answer)}</span><small>${escapeHtml(question.note)}</small></li>`).join("")}</ol></details>` : ""}
        <div class="actions">
          ${run.wrong.length ? '<button class="button dark" data-action="retry">Retry mistakes</button>' : ""}
          <button class="button ${run.wrong.length ? "outline" : "dark"}" data-action="home">Choose a stage</button>
        </div>
      </div>
    </section>`);
}

root.addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  switch (button.dataset.action) {
    case "home":
      if (run && run.index < run.questions.length && (run.index > 0 || run.checked)
        && !window.confirm("Leave this round? You’ll lose your progress.")) return;
      home();
      break;
    case "unit": start("unit", Number(button.dataset.unit)); break;
    case "mixed": start("mixed"); break;
    case "select": select(Number(button.dataset.index)); break;
    case "check": check(); break;
    case "next": next(); break;
    case "speak-next":
      run.speakingIndex++;
      if (run.speakingIndex < run.speaking.length) showSpeaking();
      else showResults();
      break;
    case "retry": start("retry", null, run.wrong); break;
  }
});

home(false);

</script>
  </body>
</html>
