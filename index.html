<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111e30">
<title>GURU | Airport Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111e30;color:#17263b;font-family:system-ui,sans-serif;padding:clamp(12px,4vw,48px)}
main{max-width:720px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#ffdaa1;font-weight:750;margin-bottom:16px;font-size:.88rem}
.card{background:#fff8e9;border-radius:22px;overflow:hidden}
.content{padding:clamp(18px,5vw,38px)}
.hero{position:relative;height:142px;background:linear-gradient(#213a59,#47617a);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#ffdda2;isolation:isolate}
.hero:before{content:"";position:absolute;bottom:16px;left:-10%;width:120%;height:45px;transform:rotate(-6deg);background:repeating-linear-gradient(90deg,#d4a778 0 25px,transparent 25px 65px) center/100% 3px no-repeat,#1a2a3f;z-index:-1}
.plane{display:block;font-family:system-ui,sans-serif;font-size:96px;line-height:1;transform:rotate(-12deg);animation:arrive .65s ease-out}
@keyframes arrive{from{translate:-65px 18px;opacity:.2}}
h1,h2,p{margin-top:0} h1{font-size:clamp(1.8rem,7vw,3rem);line-height:1.04;margin-bottom:14px}
h2{font-size:clamp(1.35rem,5vw,2rem);margin-bottom:12px}
p{line-height:1.5}
.choices,.levels,.controls{display:grid;gap:10px}
.levels button{text-align:left}
.levels strong{display:block;margin-bottom:3px}
button{background:#fffdf8;color:#17263b;border:1px solid #b8aa94;border-radius:12px;padding:12px 15px;font:inherit;font-weight:650;cursor:pointer;min-height:46px}
button:hover:not(:disabled){border-color:#17263b;background:#fff0d3}
button:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid #1a659b;outline-offset:3px}
.primary{background:#ffcc79;border-color:#8f621e}
.choices button{text-align:left}
.choices button.correct{background:#d6f1e4;border-color:#197750}
.choices button.wrong{background:#fbe0dc;border-color:#9e4435}
button:disabled{cursor:default;opacity:1;color:inherit}
.meta{color:#525b62;font-size:.9rem;font-weight:700;margin-bottom:8px}
.scene{background:#e8edf2;border-radius:14px;padding:16px;margin:14px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.avatar{display:grid;place-items:center;border-radius:50%;width:52px;height:52px;background:#fff;font-size:29px}
.scene p{margin:4px 0 0}
.track{width:100%;accent-color:#936219;margin:0 0 16px}
.feedback{padding:12px 14px;background:#e8edf2;border-radius:12px;margin:14px 0}
.feedback p{margin:4px 0 0}
.controls{margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.summary{font-size:2rem;font-weight:800}
textarea{width:100%;min-height:105px;font:inherit;padding:10px;border:1px solid #b8aa94;border-radius:10px}
footer{text-align:center;color:#e0d3bc;margin-top:16px;font-size:.85rem}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.plane{animation:none}}
</style>
</head>
<body>
<main>
<header><span>GURU × CHICKEN OR FISH</span><span id="score" hidden></span></header>
<div class="card">
<section id="home" aria-labelledby="title">
<div class="hero" aria-hidden="true"><span class="plane">✈︎</span></div>
<div class="content">
<h1 id="title" lang="en" tabindex="-1">Airport Adventure</h1>
<p>Practise cabin crew English from interview to arrival. Play all 20 missions or choose your level.</p>
<div class="levels" id="levels"></div>
</div>
</section>
<section id="play" class="content" aria-labelledby="place" hidden>
<p class="meta" id="mission"></p>
<progress id="progress" class="track" aria-label="Missions completed"></progress>
<h2 id="place" lang="en" tabindex="-1"></h2>
<div class="scene"><span id="avatar" class="avatar" aria-hidden="true"></span><div>
<strong id="character"></strong><p id="question" lang="en"></p>
</div></div>
<div class="controls"><button id="listen">🔊 Listen to the prompt</button></div>
<p id="audioStatus" role="status"></p>
<div id="choices" class="choices" lang="en"></div>
<div id="feedback" class="feedback" hidden>
<strong id="verdict"></strong><p id="correction" lang="en"></p><p id="tip"></p>
</div>
<div class="controls">
<button id="next" class="primary" hidden></button>
<button id="listenAnswer" hidden>🔊 Listen to the answer</button>
<button id="back">Choose a level</button>
</div>
</section>
<section id="result" class="content" aria-labelledby="resultTitle" hidden>
<h2 id="resultTitle" tabindex="-1">Route complete</h2>
<p id="finalScore" class="summary"></p>
<p id="message"></p>
<div class="controls">
<button id="again" class="primary">Play again</button>
<button id="copy">Copy for your trainer</button>
<button id="menu">Choose a level</button>
</div>
<p id="shareStatus" role="status"></p>
<textarea id="shareText" aria-label="Results for your trainer" readonly hidden></textarea>
</section>
</div>
<footer>GURU · Practice English. Fly higher.</footer>
</main>
<script>
const characters = [
  ['👩🏽‍💼', 'Sofia · Recruiter'],
  ['🧑🏻‍💼', 'Alex · Airport agent'],
  ['👩🏼‍✈️', 'Maya · Flight attendant'],
  ['🧑🏾‍✈️', 'Daniel · Flight attendant']
];
const missions = [["A1","0","Crew introduction","Please introduce yourself.","My name is Anna. I'm from Russia.","My name Anna. I from Russia.","I have Anna. I'm Russia.","Use “My name is…” to introduce yourself and “I’m from…” to say where you come from."],["A1","1","Check-in","Where is Gate 12?","Go straight and turn left.","Turn left after Gate 12.","Your seat is 12A.","“Go straight” means keep going in the same direction. “Turn left” tells the passenger which way to go next."],["A1","2","Boarding","A passenger steps onto the plane. Greet them.","Good morning! Welcome on board.","Goodbye! Have a nice day.","Good night! See you tomorrow.","Say “Welcome on board!” when someone enters the aircraft."],["A1","2","Find the seat","Excuse me, I can't find my seat.","May I see your boarding pass?","May I take your drink?","May I close the door?","“May I see…?” is a polite way to ask someone to show you something."],["A1","3","Drink service","Offer a passenger some water.","Would you like some water?","Do you have any water?","Could I have some water?","“Would you like…?” is a polite way to offer something."],["A1","3","Tea or coffee","Could I have some tea, please?","Of course. With milk or lemon?","Of course. Window or aisle?","Of course. What is your seat number?","Ask “With milk or lemon?” to find out how the passenger takes their tea."],["A2","0","Interview","How do you help nervous passengers?","I listen first and explain what to expect.","I expect them to explain the flight to me.","I wait for them to stop asking questions.","“What to expect” means what is likely to happen next."],["A2","1","Bag drop","Can I take this suitcase on board? It’s over the cabin baggage limit.","I'm afraid it needs to be checked in.","You can keep it under your seat.","I'll tag it as cabin baggage.","To “check in a bag” is to hand it over so it can travel in the aircraft hold."],["A2","1","Gate change","Is my flight still leaving from Gate 12? It’s now at Gate 18.","The gate has changed to Gate 18.","Your seat has changed to 18A.","Boarding starts in eighteen minutes.","Use “The gate has changed to…” to tell passengers the new gate number."],["A2","2","Seat location","My boarding pass says 14C. Is that by the window? 14C is on the aisle.","It's an aisle seat in row 14.","It's a window seat in row 14.","It's the middle seat in row 14.","An “aisle seat” is next to the walkway. A “row” is a line of seats."],["A2","2","Hand luggage","Can I leave my bag here in the aisle?","Could you put it under the seat in front of you?","Could you leave it beside your feet in the aisle?","Could you put it right by the exit?","“The seat in front of you” is the seat directly ahead of yours."],["A2","3","Meal service","We’re out of chicken. Offer the other available meal.","I'm afraid we're out of chicken. Would you like fish instead?","The chicken is ready. Would you like to wait?","We’re out of fish. Would you like chicken instead?","“We’re out of…” means there is none left. “Instead” introduces an alternative."],["A2","3","Extra blanket","I'm feeling cold. Do you have a spare blanket?","Let me check if we have one available.","Let me check what time we land.","Let me see if your meal is ready.","A “spare blanket” is an extra blanket you can offer if one is available."],["B1","0","Interview follow-up","Tell me about a time you handled a complaint.","A guest was upset about a delay, so I gave them an update and offered a place to wait.","I usually arrive early and make sure my uniform looks neat.","I would probably ask someone else to speak to the guest.","“Tell me about a time…” asks for a specific example from the past. Explain what happened and what you did."],["B1","1","Tight connection","My flight is delayed. Can you guarantee I’ll make my connection?","I can't guarantee that, but I can check your connection and available options.","Yes, I'm sure the next flight will wait for you.","You'll have to book a new ticket before we check anything.","“I can check your options” offers help without promising the passenger will make the connection."],["B1","1","Boarding announcement","Good afternoon. We are now boarding groups one and two. All other groups, please remain seated.","Only groups one and two should approach the gate now.","Groups one and two should remain seated.","All passengers can board now.","“Remain seated” means stay in your seat."],["B1","2","Seat mix-up","Someone is in my seat, but they say their boarding pass has the same number.","Let me check both boarding passes so we can sort this out.","Ask them to move immediately. Your seat is definitely the correct one.","Please take any empty seat and stay there for the flight.","“Sort this out” means find a solution to the problem."],["B1","3","Food allergies","I have a nut allergy. Can you confirm this dessert is safe for me?","Let me check the ingredient information. I can't confirm until I've checked.","It looks fine. I don't see any nuts.","It should be safe if you only have a small bite.","“I can’t confirm until I’ve checked” makes it clear you need to verify the information first."],["B1","3","Service complaint","I've been waiting for my drink for twenty minutes.","I understand that's frustrating. I'll check on your order now.","You'll just have to wait. Everyone else is waiting too.","You must have forgotten to order it.","“I understand that’s frustrating” acknowledges how the passenger feels before you offer to help."],["B1","2","Arrival","The seat belt sign is still on. A passenger asks if they can get their bag.","Please remain seated until the sign is switched off.","You can get your bag now if you're quick.","You can stand up as soon as we touch down.","“Until the sign is switched off” means wait until the light goes out."]].map(
  ([level, character, title, prompt, correct, distractorOne, distractorTwo, tip]) =>
    ({level, character: Number(character), title, prompt, correct, distractors: [distractorOne, distractorTwo], tip})
);
const modes = {
  all: 'Full route',
  A1: 'A1 · First phrases',
  A2: 'A2 · At the airport and on board',
  B1: 'B1 · Passenger requests and interviews'
};
const storageKey = 'guru-airport-results-v2';
const pointsPerAnswer = 20;
const el = id => document.getElementById(id);
const speech = window.speechSynthesis;
const AudioOutput = window.AudioContext || window.webkitAudioContext;
const speechAssets = 'https://cdn.jsdelivr.net/gh/foxdog-studios/meSpeak@db5aaedb4df07e7f66329b4567f7f8abadc3a28b/';
let audioContext, voiceEngine, audioSource, audioRequest = 0;
const speechBuffers = new Map();
let lastResults = readResults();
let mode, route, step, correctCount, answered, resultText;

function readResults() {
  try {
    return JSON.parse(localStorage.getItem(storageKey)) || {};
  } catch {
    return {};
  }
}

function show(screen) {
  for (const id of ['home', 'play', 'result']) el(id).hidden = id !== screen;
  el('score').hidden = screen === 'home';
}

function renderHome(moveFocus = true) {
  stopAudio();
  show('home');
  el('levels').replaceChildren();
  for (const [id, label] of Object.entries(modes)) {
    const number = id === 'all' ? missions.length : missions.filter(mission => mission.level === id).length;
    const previous = lastResults[id];
    const button = document.createElement('button');
    const strong = document.createElement('strong');
    strong.textContent = label;
    const details = number + ' missions';
    button.append(strong, details + (previous ? ' · Last score ' + previous.correct + '/' + previous.total : ''));
    button.addEventListener('click', () => start(id));
    el('levels').append(button);
  }
  if (moveFocus) el('title').focus();
}

function start(id) {
  stopAudio();
  mode = id;
  route = id === 'all' ? missions : missions.filter(mission => mission.level === id);
  step = 0;
  correctCount = 0;
  show('play');
  renderMission();
}

function renderMission() {
  answered = false;
  const mission = route[step];
  const [avatar, character] = characters[mission.character];
  el('mission').textContent = mission.level + ' · Mission ' + (step + 1) + ' of ' + route.length;
  el('progress').max = route.length;
  el('progress').value = step;
  el('place').textContent = mission.title;
  el('avatar').textContent = avatar;
  el('character').textContent = character;
  el('question').textContent = mission.prompt;
  el('score').textContent = (correctCount * pointsPerAnswer) + ' XP';
  el('audioStatus').textContent = '';
  el('listen').hidden = false;
  el('feedback').hidden = el('next').hidden = el('listenAnswer').hidden = true;
  el('choices').replaceChildren();
  const answers = [...mission.distractors];
  answers.splice(Math.floor(Math.random() * (answers.length + 1)), 0, mission.correct);
  for (const answer of answers) {
    const button = document.createElement('button');
    button.textContent = answer;
    button.addEventListener('click', () => select(button, mission));
    el('choices').append(button);
  }
  el('place').focus();
}

function select(selected, mission) {
  if (answered) return;
  answered = true;
  const correct = selected.textContent === mission.correct;
  if (correct) correctCount++;
  for (const button of el('choices').children) {
    button.disabled = true;
    if (button.textContent === mission.correct) button.classList.add('correct');
    else if (button === selected) button.classList.add('wrong');
  }
  el('score').textContent = (correctCount * pointsPerAnswer) + ' XP';
  el('progress').value = step + 1;
  el('verdict').textContent = correct ? 'Correct! +' + pointsPerAnswer + ' XP' : 'Correct answer';
  el('correction').textContent = mission.correct;
  el('tip').textContent = mission.tip;
  el('feedback').hidden = false;
  el('next').textContent = step + 1 === route.length ? 'See results →' : 'Next mission →';
  el('next').hidden = false;
  el('listenAnswer').hidden = el('listen').hidden;
  el('feedback').tabIndex = -1;
  el('feedback').focus();
}

function finish() {
  const total = route.length;
  const xp = correctCount * pointsPerAnswer;
  lastResults[mode] = {correct: correctCount, total};
  let saved = true;
  try {
    localStorage.setItem(storageKey, JSON.stringify(lastResults));
  } catch {
    saved = false;
  }
  show('result');
  el('finalScore').textContent = correctCount + ' / ' + total + ' · ' + xp + ' XP';
  let badge = 'First Flight';
  if (correctCount === total) badge = 'Ready for Takeoff';
  else if (correctCount / total >= 0.7) badge = 'On Course';
  el('message').textContent = 'Badge earned: ' + badge + '. ' +
    (saved ? 'Your score was saved in this browser.' : 'You can copy your results and send them to your trainer.');
  resultText = ['GURU × Chicken or Fish · Airport Adventure', modes[mode],
    'Correct answers: ' + correctCount + ' of ' + total, 'XP: ' + xp, 'Badge: ' + badge].join('\n');
  el('shareStatus').textContent = '';
  el('shareText').hidden = true;
  el('resultTitle').focus();
}

function stopAudio() {
  audioRequest++;
  if (audioSource) {
    audioSource.stop();
    audioSource.disconnect();
    audioSource = null;
  }
  if (speech) speech.cancel();
}

function loadVoiceEngine() {
  if (!voiceEngine) {
    const script = document.createElement('script');
    script.src = speechAssets + 'mespeak.js';
    const engineLoaded = new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        script.remove();
        reject(new Error('Voice engine timed out'));
      }, 8000);
      script.onload = () => {
        clearTimeout(timer);
        resolve(window.meSpeak);
      };
      script.onerror = () => {
        clearTimeout(timer);
        reject(new Error('Voice engine unavailable'));
      };
      document.head.append(script);
    });
    const readJSON = async path => {
      const response = await fetch(speechAssets + path, {signal: AbortSignal.timeout(8000)});
      if (!response.ok) throw new Error('Voice data unavailable');
      return response.json();
    };
    voiceEngine = Promise.all([
      engineLoaded, readJSON('mespeak_config.json'), readJSON('voices/en/en-us.json')
    ]).then(([engine, config, voice]) => {
      engine.loadConfig(config);
      engine.loadVoice(voice);
      return engine;
    }).catch(error => {
      voiceEngine = null;
      throw error;
    });
  }
  return voiceEngine;
}

function playBrowserVoice(text, request) {
  const status = el('audioStatus');
  if (!speech || !window.SpeechSynthesisUtterance) {
    status.textContent = 'Audio could not play. Try opening the game in your regular browser.';
    return;
  }
  const utterance = new SpeechSynthesisUtterance(text);
  const english = speech.getVoices().find(voice => /^en(?:-|$)/i.test(voice.lang));
  utterance.lang = english ? english.lang : 'en-US';
  if (english) utterance.voice = english;
  utterance.rate = 0.88;
  const timer = setTimeout(() => {
    if (request === audioRequest) {
      stopAudio();
      status.textContent = 'Audio could not play. Try opening the game in your regular browser.';
    }
  }, 3500);
  utterance.onstart = () => {
    clearTimeout(timer);
    if (request === audioRequest) status.textContent = '';
  };
  utterance.onerror = () => {
    clearTimeout(timer);
    if (request === audioRequest) status.textContent = 'Audio could not play. Try opening the game in your regular browser.';
  };
  speech.speak(utterance);
}

async function speak(text) {
  stopAudio();
  const request = audioRequest;
  const status = el('audioStatus');
  status.textContent = 'Loading audio…';
  try {
    if (!AudioOutput) throw new Error('Web Audio unavailable');
    audioContext ??= new AudioOutput();
    const resumed = audioContext.resume();
    let decoded = speechBuffers.get(text);
    const engine = await Promise.all([loadVoiceEngine(), resumed]).then(([loaded]) => loaded);
    if (request !== audioRequest) return;
    if (!decoded) {
      const wav = engine.speak(text, {rawdata: true, speed: 150, voice: 'en/en-us'});
      decoded = await audioContext.decodeAudioData(wav);
      speechBuffers.set(text, decoded);
    }
    if (request !== audioRequest) return;
    const source = audioContext.createBufferSource();
    source.buffer = decoded;
    source.connect(audioContext.destination);
    source.onended = () => {
      source.disconnect();
      if (audioSource === source) audioSource = null;
    };
    source.start();
    audioSource = source;
    status.textContent = '';
  } catch {
    if (request === audioRequest) playBrowserVoice(text, request);
  }
}

el('next').addEventListener('click', () => {
  if (!answered) return;
  stopAudio();
  step++;
  if (step === route.length) finish();
  else renderMission();
});
el('listen').addEventListener('click', () => speak(route[step].prompt));
el('listenAnswer').addEventListener('click', () => speak(route[step].correct));
el('again').addEventListener('click', () => start(mode));
el('back').addEventListener('click', () => renderHome());
el('menu').addEventListener('click', () => renderHome());
el('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(resultText);
    el('shareStatus').textContent = 'Copied. Paste your results into a message to your trainer.';
  } catch {
    const field = el('shareText');
    field.value = resultText;
    field.hidden = false;
    field.focus();
    field.select();
    el('shareStatus').textContent = 'Copy the selected text and send it to your trainer.';
  }
});
renderHome(false);
</script>
</body>
</html>
